services:
  worker:
    image: ghcr.io/yuramedia/papanote:${IMAGE_TAG:-latest}
    container_name: papanote-worker-${ENVIRONMENT:-production}
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      - NODE_ENV=production
      - ENVIRONMENT=${ENVIRONMENT:-production}

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M

# Wajib: komunikasi dengan gateway Caddy & yura-postgres
networks:
  default:
    name: yura-network
    external: true
