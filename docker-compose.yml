services:
  web:
    image: ghcr.io/yuramedia/papanote:${IMAGE_TAG:-latest}
    container_name: papanote-${ENVIRONMENT:-production}
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      - NODE_ENV=production
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=3000

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/api/health'); process.exit(r.status === 200 ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# Wajib: komunikasi dengan gateway Caddy & yura-postgres
networks:
  default:
    name: yura-network
    external: true
